<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .t { font-size: 14.5px; font-weight: 650; fill: #111827; }
      .s { font-size: 12px; fill: #4b5563; }
      .h { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #374151; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
      .key { fill: #f3f4f6; stroke: #374151; stroke-width: 1.4; }
      .ln { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="429" rx="18" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="32" y="40" class="h">HOW A PAGE IS READ</text>
  <text x="32" y="62" class="s">The steps of OpenThai's reference runtime (line_engine.py v2.1.4), ported to JavaScript.</text>

  <!-- row 1 -->
  <g transform="translate(32,92)">
    <rect class="key" width="160" height="96" rx="12"/>
    <text x="16" y="34" class="t">Page image</text>
    <text x="16" y="56" class="s">scan, photo or</text>
    <text x="16" y="72" class="s">screenshot (RGBA)</text>
  </g>
  <g transform="translate(222,92)">
    <rect class="box" width="166" height="96" rx="12"/>
    <text x="16" y="34" class="t">Detect lines</text>
    <text x="16" y="56" class="s">PP-OCRv6-tiny + DB</text>
    <text x="16" y="72" class="s">det.onnx · 1.8 MB</text>
  </g>
  <g transform="translate(418,92)">
    <rect class="box" width="166" height="96" rx="12"/>
    <text x="16" y="34" class="t">Orient + deskew</text>
    <text x="16" y="56" class="s">turn 90° / 180°</text>
    <text x="16" y="72" class="s">straighten &gt; 2.5°</text>
  </g>
  <g transform="translate(614,92)">
    <rect class="box" width="166" height="96" rx="12"/>
    <text x="16" y="34" class="t">Cut + split lines</text>
    <text x="16" y="56" class="s">perspective crops</text>
    <text x="16" y="72" class="s">split at wide gaps</text>
  </g>
  <g transform="translate(810,92)">
    <rect class="box" width="158" height="96" rx="12"/>
    <text x="16" y="34" class="t">Clean crops</text>
    <text x="16" y="56" class="s">48 px high, grey,</text>
    <text x="16" y="72" class="s">background flattened</text>
  </g>
  <path class="ln" d="M192,140 H220"/>
  <path class="ln" d="M388,140 H416"/>
  <path class="ln" d="M584,140 H612"/>
  <path class="ln" d="M780,140 H808"/>
  <path class="ln" d="M889,188 V214 Q889,226 877,226 H122 Q110,226 110,238 V254"/>

  <!-- row 2 -->
  <g transform="translate(32,256)">
    <rect class="box" width="160" height="96" rx="12"/>
    <text x="16" y="34" class="t">Recognize</text>
    <text x="16" y="56" class="s">CTC, 530 classes</text>
    <text x="16" y="72" class="s">rec.onnx · 2.4 MB</text>
  </g>
  <g transform="translate(222,256)">
    <rect class="box" width="166" height="96" rx="12"/>
    <text x="16" y="34" class="t">rec2 re-read</text>
    <text x="16" y="56" class="s">loopless fonts</text>
    <text x="16" y="72" class="s">(Kanit, Prompt)</text>
  </g>
  <g transform="translate(418,256)">
    <rect class="box" width="166" height="96" rx="12"/>
    <text x="16" y="34" class="t">Floating marks</text>
    <text x="16" y="56" class="s">tone marks of old</text>
    <text x="16" y="72" class="s">books put back</text>
  </g>
  <g transform="translate(614,256)">
    <rect class="box" width="166" height="96" rx="12"/>
    <text x="16" y="34" class="t">Reading order</text>
    <text x="16" y="56" class="s">rows · prose columns</text>
    <text x="16" y="72" class="s">lists read across</text>
  </g>
  <g transform="translate(810,256)">
    <rect class="key" width="158" height="96" rx="12"/>
    <text x="16" y="34" class="t">Text + boxes</text>
    <text x="16" y="56" class="s">filtered, Thai-</text>
    <text x="16" y="72" class="s">normalised, per line</text>
  </g>
  <path class="ln" d="M192,304 H220"/>
  <path class="ln" d="M388,304 H416"/>
  <path class="ln" d="M584,304 H612"/>
  <path class="ln" d="M780,304 H808"/>

  <text x="32" y="396" class="s">Each line returns its text, a confidence (0–1) and a box in the original image's coordinates. Stamps,</text>
  <text x="32" y="413" class="s">signatures and specks are filtered out (and reported in <tspan font-family="ui-monospace, Menlo, monospace">dropped</tspan>); decimal commas such as 280,00 become 280.00.</text>
</svg>
