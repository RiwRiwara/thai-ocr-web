<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .t { font-size: 14.5px; font-weight: 650; fill: #111827; }
      .s { font-size: 12px; fill: #4b5563; }
      .m { font-size: 11.5px; fill: #374151; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .h { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #374151; }
      .hg { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
      .key { fill: #f3f4f6; stroke: #374151; stroke-width: 1.4; }
      .ln { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#a); }
      .lg { stroke: #9ca3af; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#g); }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="469" rx="18" fill="#f8fafc" stroke="#e5e7eb"/>

  <!-- device boundary -->
  <rect x="24" y="24" width="700" height="422" rx="16" fill="#ffffff" stroke="#374151" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="46" y="52" class="h">YOUR DEVICE — the image stays here</text>

  <!-- page -->
  <g transform="translate(46,76)">
    <rect class="box" width="196" height="150" rx="12"/>
    <text x="16" y="32" class="t">Web page (UI)</text>
    <text x="16" y="56" class="s">pick, drop or paste</text>
    <text x="16" y="72" class="s">an image</text>
    <text x="16" y="100" class="s">shows text, line boxes</text>
    <text x="16" y="116" class="s">and confidence</text>
  </g>
  <path class="ln" d="M242,128 H284"/>
  <text x="247" y="118" class="s" font-size="11">image</text>
  <path class="ln" d="M284,178 H244"/>
  <text x="248" y="196" class="s" font-size="11">result</text>

  <!-- worker -->
  <rect x="286" y="76" width="416" height="350" rx="14" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="304" y="102" class="t">Web Worker</text>
  <text x="400" y="102" class="s">keeps the page responsive</text>
  <g transform="translate(304,118)">
    <rect class="key" width="380" height="72" rx="12"/>
    <text x="16" y="30" class="t">LineOCR</text>
    <text x="90" y="30" class="m">src/line-ocr.js</text>
    <text x="16" y="52" class="s">the ported runtime: detection, orientation, reading order, filters</text>
  </g>
  <path class="ln" d="M370,190 V214"/>
  <path class="ln" d="M494,190 V214"/>
  <path class="ln" d="M618,190 V214"/>
  <g transform="translate(304,216)">
    <rect class="box" width="120" height="122" rx="12"/>
    <text x="12" y="28" class="t">ONNX Runtime</text>
    <text x="12" y="46" class="t">Web</text>
    <text x="12" y="72" class="s">WebGPU (GPU)</text>
    <text x="12" y="90" class="s">or WASM (CPU,</text>
    <text x="12" y="106" class="s">1–12 threads)</text>
  </g>
  <g transform="translate(434,216)">
    <rect class="box" width="120" height="122" rx="12"/>
    <text x="12" y="28" class="t">OpenCV.js</text>
    <text x="12" y="54" class="s">minimal build</text>
    <text x="12" y="72" class="s">12 functions</text>
    <text x="12" y="90" class="s">0.77 MB gzip</text>
  </g>
  <g transform="translate(564,216)">
    <rect class="box" width="120" height="122" rx="12"/>
    <text x="12" y="28" class="t">Models</text>
    <text x="12" y="54" class="m">det.onnx</text>
    <text x="12" y="70" class="m">rec.onnx</text>
    <text x="12" y="86" class="m">rec2.onnx</text>
    <text x="12" y="108" class="s">6.6 MB, cached</text>
  </g>
  <text x="304" y="370" class="s">Also: clipper-lib (polygon offset), Thai normalisation (src/thai-norm.js).</text>
  <text x="304" y="390" class="s">Nothing in the worker talks to a server after the files are loaded.</text>

  <!-- host -->
  <text x="752" y="52" class="hg">STATIC HOST</text>
  <g transform="translate(752,76)">
    <rect class="box" width="222" height="150" rx="12"/>
    <text x="16" y="32" class="t">Cloudflare Pages</text>
    <text x="16" y="56" class="s">or any static host</text>
    <text x="16" y="84" class="s">HTML, JS, .wasm, models</text>
    <text x="16" y="100" class="s">+ COOP / COEP headers</text>
    <text x="16" y="116" class="s">for multi-threaded WASM</text>
  </g>
  <path class="lg" d="M752,262 H712"/>
  <text x="752" y="250" class="s">files, once (then cached)</text>
  <g transform="translate(752,300)">
    <rect width="222" height="86" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="16" y="30" class="t" fill="#991b1b">No upload</text>
    <text x="16" y="52" class="s">no API, no server-side OCR —</text>
    <text x="16" y="68" class="s">images are never sent anywhere</text>
  </g>
</svg>
