# Publish to npm when a GitHub release is published.
#
# Uses npm trusted publishing (OIDC): no token is stored in GitHub. One-time setup on npmjs.com, after the first
# manual `npm publish`: package → Settings → Trusted publishing → GitHub Actions, repository RiwRiwara/thai-ocr-web,
# workflow file publish.yml. Bump "version" in package.json and CHANGELOG.md before creating the release.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # no dependency cache in the release job: a poisoned cache must not reach what gets published
      - run: npm install -g npm@11   # trusted publishing needs npm 11.5.1 or later
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Check npm
        id: npm
        run: |
          name=$(node -p 'require("./package.json").name'); version=$(node -p 'require("./package.json").version')
          if ! npm view "$name" name >/dev/null 2>&1; then
            echo "::notice::$name is not on npm yet. Publish the first version by hand (npm publish), then set up trusted publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm test
      - if: steps.npm.outputs.publish == 'true'
        run: npm publish --access public
