# Publish to npm when a GitHub release is published.
#
# Uses npm trusted publishing (OIDC): no token is stored in GitHub. One-time setup on npmjs.com, after the first
# manual `npm publish`: package → Settings → Trusted publishing → GitHub Actions, repository RiwRiwara/thai-ocr-web,
# workflow file publish.yml. Bump "version" in package.json and CHANGELOG.md before creating the release.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm publish --access public
