name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests. Pull requests from forks run with this too.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parity with the Python reference runtime
        run: npm test
      - name: Build the demo
        run: npm run build
