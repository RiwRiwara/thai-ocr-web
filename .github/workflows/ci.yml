name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests. Pull requests from forks run with this too.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parity with the Python reference runtime
        run: npm test
      - name: Build the demo
        run: npm run build
